
    <section class="section section-dark" id="reserve" style="margin-top: 3rem;">
        <div class="section-header fade-in">
            <span class="section-label">Reserve Your Seat</span>
            <h2>Get Your <em>Ticket</em></h2>
            <div class="divider"></div>
            <p>Complete the form below. You will receive a SpeedeeQR payment code via email to confirm your booking.</p>
        </div>
        <div style="max-width: 600px; margin: 0 auto;">
            <form action="https://formspree.io/f/mqpzrwag" method="POST" class="fade-in">
                <div style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
                    <input type="text" name="website" tabindex="-1" autocomplete="off" value="">
                </div>
                <input type="hidden" name="subject" value="HOUS Brunch Ticket Reservation — 19 Sept 2026">
                <input type="hidden" name="event" value="The HOUS Brunch">
                <input type="hidden" name="event_date" value="19 September 2026">

                <div class="grid-2" style="gap: 1rem;">
                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" name="first_name" class="form-control" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label>Surname *</label>
                        <input type="text" name="surname" class="form-control" placeholder="Your surname" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label>Mobile *</label>
                    <input type="tel" name="phone" class="form-control" placeholder="+27 ..." required>
                </div>

                <div class="form-group">
                    <label>Ticket Tier *</label>
                    <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; margin-top: 0.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: rgba(250,247,240,0.9);">
                            <input type="radio" name="ticket_tier" value="Tier 1 — R100 (Entry + Networking)" required style="accent-color: var(--gold);">
                            <span><strong>Tier 1</strong> — R100<br><span style="font-size: 0.8rem; opacity: 0.6;">Entry + Networking</span></span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: rgba(250,247,240,0.9);">
                            <input type="radio" name="ticket_tier" value="Tier 2 — R250 (Entry + Networking + Light Treat + Priority Discovery)" required style="accent-color: var(--gold);">
                            <span><strong>Tier 2</strong> — R250<br><span style="font-size: 0.8rem; opacity: 0.6;">Entry + Networking + Light Treat + Priority Discovery</span></span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Attending As *</label>
                    <select name="attendee_type" class="form-control" required>
                        <option value="">Select...</option>
                        <option value="Individual">Individual</option>
                        <option value="Sole Trader">Sole Trader</option>
                        <option value="Business / Company">Business / Company</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Company / Business Name <span style="opacity: 0.5;">(if applicable)</span></label>
                    <input type="text" name="company_name" class="form-control" placeholder="Company name (optional)">
                </div>

                <div class="form-group">
                    <label>How did you hear about The HOUS Brunch?</label>
                    <select name="referral_source" class="form-control">
                        <option value="">Select...</option>
                        <option value="Instagram">Instagram</option>
                        <option value="Facebook">Facebook</option>
                        <option value="Threads">Threads</option>
                        <option value="Word of Mouth">Word of Mouth</option>
                        <option value="THOUS Website">THOUS Website</option>
                        <option value="Event Partner">Event Partner</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: flex-start; gap: 0.5rem; cursor: pointer; font-size: 0.85rem; color: rgba(250,247,240,0.7);">
                        <input type="checkbox" name="consent" required style="margin-top: 0.2rem; accent-color: var(--gold);">
                        <span>I consent to THOUS processing my details for this reservation and sending me the payment QR code and event updates. I understand my data is handled per the <a href="legal.html" style="color: var(--gold);">Privacy Policy</a>.</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Reserve My Seat &amp; Get Payment QR</button>

                <p style="font-size: 0.75rem; color: rgba(250,247,240,0.4); text-align: center; margin-top: 1rem;">
                    Your booking is only confirmed once payment is received via SpeedeeQR. You will receive the QR code and payment instructions via email within a few minutes.
                </p>
            </form>
        </div>
    </section>
